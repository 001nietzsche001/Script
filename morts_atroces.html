<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Les morts atroces — Une histoire à découvrir</title>
<style>
:root{--paper:#f6f2e9;--ink:#282923;--muted:#77766e;--line:#d9d3c7;--accent:#79504b;--soft:#ebe6da}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper)}
body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:26px 18px}
main{width:min(760px,100%);text-align:center;padding:20px 0 24px;margin:0 auto}
.eyebrow{font-family:Arial,sans-serif;text-transform:uppercase;letter-spacing:.2em;font-size:.72rem;color:var(--muted);margin:0 0 18px}
h1{font-size:clamp(2.05rem,7vw,3.8rem);font-weight:normal;letter-spacing:-.045em;margin:0}
.rule{width:54px;height:1px;background:var(--line);margin:20px auto 0}
.person-area{min-height:350px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px 12px 26px}
.mark{font-size:2.8rem;line-height:1;color:#b7a49b;margin-bottom:18px}
.name{font-size:clamp(1.8rem,5.4vw,2.8rem);line-height:1.2;font-weight:normal;margin:0 auto 10px;max-width:690px}
.dates{font-family:Arial,sans-serif;font-size:.88rem;letter-spacing:.04em;color:var(--accent);margin:0 0 24px}
.meta{font-family:Arial,sans-serif;font-size:.9rem;line-height:1.7;color:#5d5c54;max-width:620px;margin:0 auto 8px;overflow-wrap:anywhere}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);display:block;margin:21px 0 7px;font-family:Arial,sans-serif}
.detail{font-size:1rem;line-height:1.75;max-width:620px;margin:0 auto;color:var(--ink);overflow-wrap:anywhere}
.placeholder{color:var(--muted);font-size:1.1rem;line-height:1.8;max-width:430px}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:4px}
button{font-family:Arial,sans-serif;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:17px 26px;min-width:min(300px,100%);font-size:.76rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,color .2s,transform .2s}
button:hover{background:transparent;color:var(--ink)}button:active{transform:scale(.985)}button:focus-visible{outline:3px solid #b79b95;outline-offset:4px}
.secondary{border:0;background:transparent;color:var(--muted);min-width:0;padding:8px 12px;font-size:.72rem;font-weight:normal;letter-spacing:.08em}
.secondary:hover{color:var(--ink);background:transparent;text-decoration:underline}
.status{font-family:Arial,sans-serif;font-size:.75rem;color:var(--muted);margin:18px 0 0;min-height:1.2em}
.footer{font-family:Arial,sans-serif;font-size:.7rem;color:#98958b;margin-top:36px;letter-spacing:.08em}
[hidden]{display:none!important}
@media(max-width:480px){body{padding:18px 18px}main{padding-top:10px}.person-area{min-height:330px;padding-left:3px;padding-right:3px}.detail{font-size:.96rem}.footer{margin-top:28px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<p class="eyebrow">Histoire · Destins · Mémoire</p>
<h1>LES MORTS ATROCES</h1>
<div class="rule"></div>
<section class="person-area" id="personArea" aria-live="polite" aria-atomic="true">
<div class="mark">†</div>
<p class="placeholder">Un destin vous attend.<br>Laissez l’histoire vous surprendre.</p>
</section>
<div class="actions">
<button id="nextBtn" type="button">Découvrir un destin</button>
<button class="secondary" id="restartBtn" type="button" hidden>Recommencer les découvertes</button>
</div>
<p class="status" id="status" aria-live="polite"></p>
<p class="footer">SE SOUVENIR · COMPRENDRE · TRANSMETTRE</p>
</main>

s romains)","raison":"Propagation du christianisme et menace supposée pour la religion d'État","ordonne_par":"L'empereur Néron"},{"id":13,"nom":"Saint Barthélemy","nationalite":"Juive (Galilée)","metier":"Apôtre","dates":"Inconnu – 71 ap. J.-C.","cause_deces":"Écorchement vif suivi de la crucifixion","raison":"Conversion du roi d'Arménie Polymios au christianisme","ordonne_par":"Astriage (Frère du roi d'Arménie)"},{"id":14,"nom":"Saint Laurent","nationalite":"Espagnole / Romaine","metier":"Diacre de Rome","dates":"225 – 258","cause_deces":"Brûlé vif sur un gril de fer chauffé au charbon","raison":"Refus de livrer les trésors de l'Église au pouvoir impérial","ordonne_par":"Le préfet de Rome sous Valérien"},{"id":15,"nom":"Sainte Blandine","nationalite":"Gallo-romaine","metier":"Esclave","dates":"162 – 177","cause_deces":"Flagellation, exposition aux bêtes, enfermement dans un filet face à un taureau furieux, puis égorgement","raison":"Refus d'abjurer la foi chrétienne","ordonne_par":"Le gouverneur romain de Lyon (Martyrs de Lyon)"},{"id":16,"nom":"Sainte Catherine d'Alexandrie","nationalite":"Égyptienne (Greco-romaine)","metier":"Érudite / Noble","dates":"287 – 305","cause_deces":"Torture sur la roue à pointes (qui se brisa), suivie de la décapitation","raison":"Refus de renoncer au christianisme et dénonciation des idolâtries","ordonne_par":"L'empereur Maxence"},{"id":17,"nom":"Sainte Sébastienne / Saint Sébastien","nationalite":"Gallo-romain","metier":"Officier de la garde prétorienne","dates":"256 – 288","cause_deces":"Criblé de flèches (survécu), puis battu à mort à coups de gourdins dans les égouts","raison":"Soutien clandestin aux martyrs chrétiens de Rome","ordonne_par":"L'empereur Diocletien"},{"id":18,"nom":"Hypatie d'Alexandrie","nationalite":"Égyptienne (Grecque)","metier":"Mathématicienne / Philosophe néoplatonicienne","dates":"360 – 415","cause_deces":"Écorchée vive avec des coquilles d'huîtres et tuiles, puis démembrée et brûlée","raison":"Accusée de paganisme et de conspiration politique contre l'évêque Cyrille","ordonne_par":"Foule de zélotes chrétiens (Parabalani) encouragée par l'entourage de Cyrille"},{"id":19,"nom":"Boèce (Anicius Manlius Severinus Boethius)","nationalite":"Romaine (Royaume Ostrogoth)","metier":"Philosophe / Sénateur / Magister officiorum","dates":"477 – 524","cause_deces":"Torture par garrot serré autour de la tête jusqu'à ce que les yeux sortent, puis battu à mort","raison":"Accusé de haute trahison en faveur de l'Empire byzantin","ordonne_par":"Théodoric le Grand (Roi des Ostrogoths)"},{"id":20,"nom":"Brunehaut (Brunehilde)","nationalite":"Visigothe / Francque","metier":"Reine des Francs (Austrasie)","dates":"543 – 613","cause_deces":"Torturée pendant 3 jours, exposée nue sur un chameau, puis attachée par les cheveux et un bras à la queue d'un cheval indompté","raison":"Lutte de pouvoir dynastique et accusation d'avoir tué 10 rois francs","ordonne_par":"Le roi Clotaire II"},{"id":21,"nom":"Leovigilde (Prince Herménégilde)","nationalite":"Visigothe","metier":"Prince Visigoth","dates":"564 – 585","cause_deces":"Décapitation à la hache dans son cachot après privation de nourriture","raison":"Conversion au catholicisme et rébellion contre son père arien","ordonne_par":"Le roi Léovigild (son père)"},{"id":22,"nom":"Constant II","nationalite":"Byzantine","metier":"Empereur byzantin","dates":"630 – 668","cause_deces":"Assassiné dans son bain à coups de seau à savon en marbre","raison":"Impopularité extrême due à la pression fiscale et aux querelles religieuses","ordonne_par":"Son serviteur André avec la complicité d'un général"},{"id":23,"nom":"Pape Jean VIII","nationalite":"Italienne","metier":"Pape de l'Église catholique","dates":"820 – 882","cause_deces":"Empoisonné par son entourage, puis achevé à coups de marteau sur le crâne","raison":"Rivalités politiques pour le contrôle du Saint-Siège","ordonne_par":"Des membres de sa propre faction/famille"},{"id":24,"nom":"Pape Formose (Jugement posthumain : Le Concile cadavérique)","nationalite":"Italienne","metier":"Pape de l'Église catholique","dates":"816 – 896","cause_deces":"Exhumé 9 mois après sa mort, jugé en habits pontificaux, amputé de 3 doigts, décapité et jeté dans le Tibre","raison":"Accusations d'usurpation du siège pontifical sous la pression de factions politiques","ordonne_par":"Le Pape Étienne VI"},{"id":25,"nom":"Pape Étienne VI","nationalite":"Italienne","metier":"Pape de l'Église catholique","dates":"Inconnu – 897","cause_deces":"Strangulation dans sa cellule de prison","raison":"Scandale populaire provoqué par la profanation du corps du Pape Formose","ordonne_par":"La faction politique adverse romaine"},{"id":26,"nom":"Al-Hallaj (Mansur al-Hallaj)","nationalite":"Perse","metier":"Poète / Mystique soufi","dates":"858 – 922","cause_deces":"Flagellation, amputation des mains et pieds, exposition sur le gibet, décapitation et incinération du corps","raison":"Hérésie supposée et déclarations mystiques perçues comme un blasphème (« Je suis la Vérité »)","ordonne_par":"Le calife abbasside Al-Muqtadir"},{"id":27,"nom":"Édouard II","nationalite":"Anglaise","metier":"Roi d'Angleterre","dates":"1284 – 1327","cause_deces":"Enfoncement d'un fer rouge chauffé à blanc dans les entrailles par le rectum (afin de ne laisser aucune marque visible)","raison":"Déposition pour tyrannie, incompétence et alliances favoritistes","ordonne_par":"La reine Isabelle de France et Roger Mortimer"},{"id":28,"nom":"Guillaume de Nogaret","nationalite":"Française","metier":"Garde des Sceaux / Conseiller royal","dates":"1260 – 1313","cause_deces":"Empoisonnement soudain (présumé par la légende de la malédiction des Templiers)","raison":"Rôle majeur dans l'attentat d'Anagni contre le pape et l'anéantissement des Templiers","ordonne_par":"Circonstances suspectes / Ennemis politiques"},{"id":29,"nom":"Jacques de Molay","nationalite":"Française","metier":"Dernier Grand Maître de l'Ordre du Temple","dates":"1244 – 1314","cause_deces":"Brûlé vif à petit feu sur l'île aux Juifs à Paris","raison":"Accusations d'hérésie, d'homosexualité et de reniement du Christ après être revenu sur ses aveux","ordonne_par":"Le roi Philippe IV le Bel"},{"id":30,"nom":"Geoffroy de Charny","nationalite":"Française","metier":"Commandeur de l'Ordre du Temple (Normandie)","dates":"1251 – 1314","cause_deces":"Brûlé vif à petit feu aux côtés de Jacques de Molay","raison":"Rétractation de ses aveux d'hérésie concernant les pratiques de l'Ordre","ordonne_par":"Le roi Philippe IV le Bel"},{"id":31,"nom":"Gauthier d'Aunay","nationalite":"Française","metier":"Chevalier de la noblesse normande","dates":"1288 – 1314","cause_deces":"Écorché vif, castré, roué, éviscéré, décapité puis pendu par les aisselles (Affaire de la tour de Nesle)","raison":"Crime de lèse-majesté et adultère avec la belle-fille du roi de France","ordonne_par":"Le roi Philippe IV le Bel"},{"id":32,"nom":"Philippe d'Aunay","nationalite":"Française","metier":"Chevalier normand","dates":"1290 – 1314","cause_deces":"Écorché vif, castré, roué, éviscéré, décapité puis pendu par les aisselles","raison":"Crime de lèse-majesté et adultère avec Marguerite de Bourgogne","ordonne_par":"Le roi Philippe IV le Bel"},{"id":33,"nom":"William Wallace","nationalite":"Écossaise","metier":"Chevalier / Chef de la résistance écossaise","dates":"1270 – 1305","cause_deces":"Pendu, patronné (viscères brûlés sous ses yeux), décapité et écartelé (Hanged, drawn and quartered)","raison":"Haute trahison envers la couronne d'Angleterre","ordonne_par":"Le roi Édouard Ier d'Angleterre"},{"id":34,"nom":"David ap Gruffydd","nationalite":"Galloise","metier":"Prince de Galles","dates":"1238 – 1283","cause_deces":"Premier noble exécuté par le supplice complet des 4 étapes : traîné par un cheval, pendu, éviscéré/brûlé vif, écartelé","raison":"Rébellion armée et haute trahison contre le roi d'Angleterre","ordonne_par":"Le roi Édouard Ier d'Angleterre"},{"id":35,"nom":"Hugh Despenser le Jeune","nationalite":"Anglaise","metier":"Favori et conseiller d'Édouard II","dates":"1286 – 1326","cause_deces":"Pendu, castré, éviscéré à vif, décapité et écartelé","raison":"Trahison, tyrannie, détournement de fonds du royaume","ordonne_par":"La reine Isabelle de France et Roger Mortimer"},{"id":36,"nom":"Fra Dolcino","nationalite":"Italienne","metier":"Prédicateur hérétique / Chef des Frères Apostoliques","dates":"1250 – 1307","cause_deces":"Tenaillé avec des fers rouges sur un char public, membres brisés, puis brûlé vif","raison":"Hérésie et guerre Sainte millénariste contre l'Église romaine","ordonne_par":"Le pape Clément V et le tribunal d'Inquisition"},{"id":37,"nom":"Gérard Segarelli","nationalite":"Italienne","metier":"Fondateur des Frères Apostoliques","dates":"1240 – 1300","cause_deces":"Brûlé vif sur le bûcher","raison":"Hérésie et refus de dissoudre son mouvement de pauvreté radicale","ordonne_par":"L'Inquisition de Parme"},{"id":38,"nom":"Margarita da Trento","nationalite":"Italienne","metier":"Compagne de Fra Dolcino","dates":"Inconnu – 1307","cause_deces":"Brûlée vive sur le bûcher sous les yeux de Fra Dolcino","raison":"Hérésie dolcinienne et participation à la rébellion armée","ordonne_par":"L'Inquisition"},{"id":39,"nom":"Jan Hus","nationalite":"Bohémienne (Tchèque)","metier":"Théologien / Universitaire / Réformateur religieux","dates":"1369 – 1415","cause_deces":"Brûlé vif sur le bûcher avec ses écrits","raison":"Hérésie contre la doctrine catholique (précurseur du protestantisme)","ordonne_par":"Le Concile de Constance et l'empereur Sigismond"},{"id":40,"nom":"Jérôme de Prague","nationalite":"Bohémienne (Tchèque)","metier":"Théologien / Disciple de Jan Hus","dates":"1379 – 1416","cause_deces":"Brûlé vif sur le bûcher au même endroit que Jan Hus","raison":"Hérésie et soutien aux thèses hussites","ordonne_par":"Le Concile de Constance"},{"id":41,"nom":"Gilles de Rais","nationalite":"Française","metier":"Maréchal de France / Compagnon d'armes de Jeanne d'A n Neptune Spear), corps immergé en mer","raison":"Commanditaire suprême des attentats du 11 septembre 2001 aux États-Unis","ordonne_par":"Le président des États-Unis Barack Obama (Exécuté par les Navy SEALs / DEVGRU)"},{"id":399,"nom":"Muammar Kadhafi","nationalite":"Libyenne","metier":"Guide de la Révolution libyenne / Dictateur","dates":"1942 – 2011","cause_deces":"Capturé dans un tuyau d'évacuation, lynché, sodomisé à la baïonnette et exécuté d'une balle dans la tête à Syrte","raison":"Répression sanglante de la révolution libyenne pendant le Printemps arabe","ordonne_par":"Les rebelles armés du Conseil national de transition (CNT)"},{"id":400,"nom":"Shinzo Abe","nationalite":"Japonaise","metier":"Ancien Premier ministre du Japon","dates":"1954 – 2022","cause_deces":"Abattu de deux coups de feu tirés avec une arme artisanale lors d'un discours électoral à Nara","raison":"Rancœur de l'assassin liée aux liens présumés de l'homme politique avec l'Église de la Unification (Secte Moon)","ordonne_par":"Tetsuya Yamagami"}];
const area = document.getElementById('personArea');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');
const status = document.getElementById('status');
let order = [];
let position = 0;
function shuffle(items){
  const a = [...items];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function start(){order=shuffle(people);position=0;nextBtn.hidden=false;nextBtn.disabled=false;nextBtn.textContent='Découvrir un destin';restartBtn.hidden=true;status.textContent='';area.innerHTML='<div class="mark">†</div><p class="placeholder">Un destin vous attend.<br>Laissez l’histoire vous surprendre.</p>';}
function addText(tag, className, value){
  if(!value)return;
  const el=document.createElement(tag);el.className=className;el.textContent=value;area.append(el);
}
function addDetail(labelText, value){
  if(!value)return;
  addText('span','label',labelText);
  addText('p','detail',value);
}
function showPerson(p){
  area.replaceChildren();
  addText('div','mark','†');
  addText('h2','name',p.nom||'Personnage');
  addText('p','dates',p.dates||'');
  addText('p','meta',p.nationalite||'');
  addText('p','meta',p.metier||'');
  addDetail('Cause du décès',p.cause_deces);
  addDetail('Motif indiqué',p.raison);
  addDetail('Autorité ou responsable indiqué',p.ordonne_par);
}
nextBtn.addEventListener('click',()=>{
  if(position>=order.length)return;
  showPerson(order[position]);position++;
  if(position>=order.length){nextBtn.hidden=true;restartBtn.hidden=false;status.textContent='Vous avez découvert les 400 destins.';}
});
restartBtn.addEventListener('click',start);
start();
</script>
